[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revnuvo-trust"
version = "0.1.0"
description = "Revnuvo Trust API client: verify companies, domains and counterparties from Python or any AI agent. Entity resolution (200+ jurisdictions), UBO, sanctions screening, 0-100 fraud scoring. x402-payable ($0.10/call, USDC on Base) or API key."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Revnuvo Technologies Ltd", email = "Ismael@revnuvo.site"}]
requires-python = ">=3.9"
keywords = ["trust", "verification", "kyb", "fraud-scoring", "x402", "agentic-commerce", "mcp", "ai-agents", "entity-resolution", "sanctions-screening"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://www.revnuvo.site/products/trust"
"Trust API" = "https://api.revnuvo.site"

[project.scripts]
revnuvo-trust = "revnuvo_trust.__main__:main"
