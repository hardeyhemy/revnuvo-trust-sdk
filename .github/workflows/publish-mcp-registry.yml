name: Publish to official MCP Registry

on:
  push:
    branches: [main]
    paths: ['server.json', 'server-company-intelligence.json']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (direct release download)
        run: |
          curl -fsSL -o /tmp/mpub.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          mkdir -p ./bin && tar -xzf /tmp/mpub.tar.gz -C ./bin
          chmod +x ./bin/mcp-publisher
          ./bin/mcp-publisher --version

      - name: Authenticate via GitHub Actions OIDC
        run: ./bin/mcp-publisher login github-oidc

      # Idempotent: re-runs skip an already-published (duplicate) version but
      # still fail loudly on any other publish error.
      - name: Publish Trust server
        run: |
          if ! out=$(./bin/mcp-publisher publish server.json 2>&1); then
            if echo "$out" | grep -q "cannot publish duplicate version"; then
              echo "Trust server already published at this version — skipping"
            else
              echo "$out"; exit 1
            fi
          fi

      - name: Publish Company Intelligence server
        run: |
          if ! out=$(./bin/mcp-publisher publish server-company-intelligence.json 2>&1); then
            if echo "$out" | grep -q "cannot publish duplicate version"; then
              echo "Company Intelligence server already published at this version — skipping"
            else
              echo "$out"; exit 1
            fi
          fi
